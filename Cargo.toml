[package]
name = "riff"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A modern soundboard with a virtual microphone, hotkeys, TTS and Freesound"
license = "Apache-2.0"
repository = "https://github.com/sardeq/riff"

[dependencies]
# glow (OpenGL) renderer: lighter than wgpu and needs no Vulkan loader on NixOS
eframe = { version = "0.36", default-features = false, features = ["glow", "accesskit", "default_fonts", "links", "wayland", "x11"] }
egui = "0.36"
egui-phosphor = "0.14"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "adpcm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rfd = "0.17"
crossbeam-channel = "0.5"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
fuzzy-matcher = "0.3"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
ureq = { version = "3", features = ["json"] }
fastrand = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2"
libpulse-simple-binding = "2"
evdev = "0.13"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.16"
global-hotkey = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
